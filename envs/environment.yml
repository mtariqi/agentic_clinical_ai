name: agentic-clinical-ai
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal>=8.0
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - jinja2>=3.1
  - pyyaml>=6.0
  - pytest>=8.0
  - pip
  - pip:
      - anthropic>=0.40   # optional: only used when agents.planner = "anthropic"
