<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Agentic Clinical AI</title>
  <desc id="d">Governed agents for clinical data surveillance and enrollment forecasting: statistics detect, agents decide, policy governs, every action is hash-chained.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A30"/>
      <stop offset="1" stop-color="#16424B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#84C3CC" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#84C3CC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#84C3CC" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>

  <!-- monitoring trace: steady signal, then an anomaly that is caught -->
  <path d="M0 300 L120 300 L140 292 L160 306 L180 298 L240 300 L300 300 L320 296 L340 302 L400 300 L460 300 L478 262 L492 330 L506 286 L520 300 L640 300"
        fill="none" stroke="url(#trace)" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="478" cy="262" r="9" fill="none" stroke="#F0A25A" stroke-width="2"/>
  <circle cx="478" cy="262" r="3" fill="#F0A25A"/>

  <!-- title block -->
  <text x="72" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F2F7F8" letter-spacing="-1">Agentic Clinical AI</text>
  <text x="74" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#B9D6DB">Governed agents for clinical data surveillance</text>
  <text x="74" y="194" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#B9D6DB">and enrollment forecasting</text>
  <text x="74" y="240" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#84C3CC">Bounded autonomy. Human approval. Tamper-evident audit. Reproducible with Snakemake.</text>

  <!-- governance stack -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g transform="translate(800,52)">
      <rect width="400" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#84C3CC" stroke-opacity="0.55"/>
      <text x="22" y="26" font-size="13" fill="#84C3CC" font-weight="600">DETECT</text>
      <text x="22" y="45" font-size="15" fill="#E3EEF0">Robust z-scores, Isolation Forest, Poisson–Gamma</text>
    </g>
    <path d="M1000 112 v14" stroke="#84C3CC" stroke-opacity="0.6" stroke-width="2"/>
    <g transform="translate(800,128)">
      <rect width="400" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#84C3CC" stroke-opacity="0.55"/>
      <text x="22" y="26" font-size="13" fill="#84C3CC" font-weight="600">DECIDE</text>
      <text x="22" y="45" font-size="15" fill="#E3EEF0">Surveillance and enrollment agents</text>
    </g>
    <path d="M1000 188 v14" stroke="#84C3CC" stroke-opacity="0.6" stroke-width="2"/>
    <g transform="translate(800,204)">
      <rect width="400" height="58" rx="10" fill="#F0A25A" fill-opacity="0.12" stroke="#F0A25A" stroke-opacity="0.8"/>
      <text x="22" y="26" font-size="13" fill="#F0A25A" font-weight="600">GOVERN</text>
      <text x="22" y="45" font-size="15" fill="#F6E7D6">Policy engine, autonomy tiers, human queue</text>
    </g>
    <!-- hash chain -->
    <g transform="translate(800,284)">
      <text x="0" y="16" font-size="13" fill="#84C3CC" font-weight="600">AUDIT</text>
      <g fill="#FFFFFF" fill-opacity="0.08" stroke="#84C3CC" stroke-opacity="0.7">
        <rect x="64" y="0" width="56" height="24" rx="5"/>
        <rect x="148" y="0" width="56" height="24" rx="5"/>
        <rect x="232" y="0" width="56" height="24" rx="5"/>
        <rect x="316" y="0" width="56" height="24" rx="5"/>
      </g>
      <g stroke="#84C3CC" stroke-opacity="0.7" stroke-width="2">
        <path d="M120 12 h28"/><path d="M204 12 h28"/><path d="M288 12 h28"/><path d="M372 12 h20"/>
      </g>
      <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#B9D6DB" text-anchor="middle">
        <text x="92" y="16">a3f9…</text><text x="176" y="16">7c21…</text><text x="260" y="16">e04b…</text><text x="344" y="16">91d6…</text>
      </g>
    </g>
  </g>
</svg>
